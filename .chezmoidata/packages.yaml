packages:
  darwin:
    upgrade: false
    taps:
      - nohajc/anylinuxfs
    brews:
      - chezmoi
      - coreutils
      - curl
      - freerdp
      - git
      - gh
      - glab
      - golang
      - gpg2
      - gpgme
      - gs
      - imagemagick
      - jq
      - lazygit
      - libvirt
      - luarocks
      - neovim
      - openssl
      - qemu
      - ripgrep
      - rust
      - starship
      - tmux
      - virt-manager
      - wget2
      - yq
    casks:
      - claude
      - codex
      - element
      - font-adwaita-mono-nerd-font
      - gcloud-cli
      - iterm2
      - keepassxc
      - zoom
  linux:
    fedora:
      repos:
        - name: google-cloud-cli
          value: |-
            [google-cloud-cli]
            name=Google Cloud CLI
            baseurl=https://packages.cloud.google.com/yum/repos/cloud-sdk-el10-x86_64
            enabled=1
            gpgcheck=1
            repo_gpgcheck=0
            gpgkey=https://packages.cloud.google.com/yum/doc/rpm-package-key-v10.gpg
        - name: claude-code
          value: |-
            [claude-code]
            name=Claude Code
            baseurl=https://downloads.claude.ai/claude-code/rpm/stable
            enabled=1
            gpgcheck=1
            repo_gpgcheck=0
            gpgkey=https://downloads.claude.ai/keys/claude-code.asc
        - name: rcm-tools-fedora-rpms
          value: |-
            [rcm-tools-fedora-rpms]
            name=RCM Tools for Fedora \$releasever (RPMs)
            baseurl=https://download.devel.redhat.com/rel-eng/RCMTOOLS/latest-RCMTOOLS-2-F-\$releasever/compose/Everything/\$basearch/os/
            enabled=1
            gpgcheck=1
            gpgkey=https://download.devel.redhat.com/rel-eng/RCMTOOLS/RPM-GPG-KEY-rcminternal
            skip_if_unavailable=1
      coprs:
        - atim/starship
        - atim/lazygit
        - fluhus/gnome-googledrive
        - goncalossilva/act
        - copr.devel.redhat.com/rhcopr-project/toolset
      groups:
        - rpm-development-tools
      rpms:
        - act-cli
        - cargo
        - centpkg
        - chezmoi
        - claude-code
        - cockpit
        - cockpit-machines
        - cockpit-podman
        - copr-cli
        - curl
        - fedpkg
        - firewalld
        - git
        - gh
        - glab
        - golang
        - go-rpm-macros
        - google-cloud-cli
        - guestfs-tools
        - jq
        - keepassxc
        - lazygit
        - libvirt-client
        - libvirt-daemon-kvm
        - libvirt-daemon
        - libvirt-nss
        - libxcrypt-compat.x86_64
        - luarocks
        - neovim
        - openssl
        - podman
        - podman-docker
        - podman-compose
        - qemu-img
        - qemu-kvm
        - redhat-internal-linfo3
        - rhcopr
        - rhpkg
        - starship
        - tmux
        - virt-install
        - yq
      flatpaks:
        - remote: flathub
          apps:
            - us.zoom.Zoom
            - im.riot.Riot
      update: false
